<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Listas</title>
</head>
<body>
  <h2>Lista no ordenada</h2>
  <ul>
    <li>Elemento A</li>
    <li>Elemento B
      <ul>
        <li>Sub-elemento B1</li>
        <li>Sub-elemento B2</li>
      </ul>
    </li>
    <li>Elemento C</li>
  </ul>

  <h2>Lista ordenada</h2>
  <ol>
    <li>Primer paso</li>
    <li>Segundo paso</li>
    <li>Tercer paso</li>
  </ol>
</body>
</html>
